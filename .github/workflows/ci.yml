name: Mizan ERP CI/CD Pipeline

on:
  push:
    branches: [ main, security-production-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Backend Code Syntax & Build
        run: |
          cd server
          node --check index.js src/app.js

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Production Frontend Assets
        run: |
          cd client
          npm run build
